name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Web App Package
        run: |
          mkdir -p Payload
          cp main.html Payload/index.html
          zip -r app.zip Payload

      - name: Archive Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-bundle
          path: app.zip
